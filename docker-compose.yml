# Local development services for RD-Sync.
#
# Postgres:
#   Credentials and database name match the dev DATABASE_URL:
#     postgresql://rd_sync:rd_sync@localhost:5432/rd_sync
#   These are LOCAL DEV credentials only and must never be used in production.
#
# Redis:
#   Dev URL (no auth): redis://localhost:6379
#   Set RD_SYNC_REDIS_URL=redis://localhost:6379 to enable the durable BullMQ
#   queue and run the separate worker process (pnpm worker).
#
# Usage:
#   docker compose up -d         # start Postgres + Redis
#   pnpm db:push                 # apply the Prisma schema to rd_sync
#   docker compose down          # stop (keeps data in named volumes)
#   docker compose down -v       # stop and wipe all data
#
# The initdb script also creates a throwaway `rd_sync_test` database used by
# the gated Prisma contract tests (RD_SYNC_TEST_DATABASE_URL).

services:
  postgres:
    image: postgres:17-alpine
    container_name: rd-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rd_sync
      POSTGRES_PASSWORD: rd_sync
      POSTGRES_DB: rd_sync
    ports:
      - "5432:5432"
    volumes:
      - rd-sync-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rd_sync -d rd_sync"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Redis — durable BullMQ job queue backend.
  # Data is persisted via appendonly AOF so jobs survive a container restart.
  redis:
    image: redis:7-alpine
    container_name: rd-sync-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - rd-sync-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rd-sync-pgdata:
  rd-sync-redis-data:
