schema: spec-driven
version: 1
project: RD-Sync
artifact_store:
  mode: openspec
initialized_at: "2026-06-07"

context: |
  Product: RD-Sync MVP, a private dashboard for recent bank transactions from Dominican banks.
  MVP scope: scrape or collect recent bank transactions and show them to designated employees with filters.
  Access boundary: employees must not access bank portals and must only see transaction data.
  Out of MVP: ERP integration and reconciliation because the ERP is not ready.
  Tech stack: Next.js App Router, TypeScript, Prisma 7, PostgreSQL, Vitest, Playwright.
  Architecture: modular monolith plus separate worker process planned by design.md.
  Testing: Vitest unit runner and Playwright E2E config exist after PR 1 scaffold.
  Persistence: OpenSpec file artifacts under openspec/.

strict_tdd: true

testing:
  detected_at: "2026-06-07"
  strict_tdd: true
  reason: "PR 1 scaffold introduced package.json, Vitest, Playwright, and TypeScript typecheck commands. Future implementation slices must use Strict TDD where practical."
  test_runner:
    available: true
    command: "pnpm test"
    framework: "Vitest"
  layers:
    unit:
      available: true
      tool: "Vitest"
    integration:
      available: false
      tool: ""
    e2e:
      available: true
      tool: "Playwright"
      command: "pnpm test:e2e"
  coverage:
    available: true
    command: "pnpm test -- --coverage"
  quality_tools:
    linter:
      available: true
      command: "pnpm lint"
    type_checker:
      available: true
      command: "pnpm typecheck"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Include security, credential-handling, and employee data-access boundaries for all bank-transaction work.
    - Exclude ERP integration and reconciliation unless the product scope is explicitly changed.
    - Identify legal/compliance risks around bank scraping before implementation tasks are approved.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords: MUST, SHALL, SHOULD, MAY.
    - Separate access-control requirements from dashboard filtering requirements.
  design:
    - Include sequence diagrams for scraping, transaction ingestion, and dashboard read paths when those flows are introduced.
    - Document credential storage, secret rotation, audit logging, and least-privilege boundaries with rationale.
  tasks:
    - Group tasks by phase and keep each task completable in one focused session.
    - Include a Review Workload Forecast before implementation begins.
  apply:
    tdd: true
    test_command: "pnpm test"
    guidelines:
      - Follow existing code patterns after a stack is selected.
      - Do not create direct bank-login functionality for employees.
      - Use Strict TDD for implementation slices after PR 1 scaffold.
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
    guidelines:
      - Verify access-control and data-minimization requirements before accepting implementation.
      - Verify no ERP integration or reconciliation behavior enters MVP scope unless explicitly re-scoped.
  archive:
    - Warn before merging destructive deltas.

